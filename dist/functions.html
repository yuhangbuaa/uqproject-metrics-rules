<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>函数定义 · 项目指标库与规则库</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .source-page{max-width:1120px;margin:0 auto;padding:42px 5% 80px}
      .source-back{font-size:13px;color:#145e60;font-weight:750}
      .source-page h1{font-size:clamp(30px,4vw,48px);margin:25px 0 10px;letter-spacing:-.03em}
      .source-intro{color:#5f737b;font-size:14px;line-height:1.8;max-width:790px}
      .source-meta{display:flex;flex-wrap:wrap;gap:10px;margin:23px 0 18px}
      .source-meta span{background:#e4f1ee;color:#145e60;border-radius:99px;padding:5px 12px;font-size:11px;font-weight:750}
      .source-frame{background:#173942;color:#e8f4f1;border-radius:12px;border:1px solid #2d5860;box-shadow:0 18px 55px rgba(22,54,65,.12)}
      .source-frame pre{margin:0;padding:22px 24px;overflow:auto;font:12px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;tab-size:2}
      .source-line.target{background:#345f61;color:#fff;outline:3px solid #7bc8ba;outline-offset:1px}
      .source-error{padding:24px;color:#fff}
      @media(max-width:600px){.source-page{padding-top:25px}.source-frame pre{font-size:11px;padding:15px}}
    </style>
  </head>
  <body>
    <main class="source-page">
      <a class="source-back" href="./index.html#catalog">← 返回指标与规则目录</a>
      <h1 id="sourceTitle">函数定义</h1>
      <p class="source-intro">这里展示可下载调用的完整函数模块，包含共用依赖。PlanCoder 的三个质量评分函数接收 apiKey、baseUrl、model 及任务与计划，使用 await 获取模型实际评分和理由；Node.js 18+ 可直接调用，浏览器调用需要服务支持跨域。规则函数返回条件标记。P-I01 的 CodeBLEU 相似度由调用方提供。</p>
      <a class="source-back" href="./catalog-functions.mjs" download>下载函数模块 ↓</a>
      <div class="source-meta"><span>UTF-8 显式解码</span><span>浏览器本地读取</span><span id="sourceStatus">正在载入…</span></div>
      <div class="source-frame"><pre id="sourceCode" aria-label="函数源码">正在载入函数定义…</pre></div>
    </main>
    <script>
      (async () => {
        const requested = new URLSearchParams(location.search).get('name') || '';
        const title = document.getElementById('sourceTitle');
        const status = document.getElementById('sourceStatus');
        const code = document.getElementById('sourceCode');
        try {
          const response = await fetch('./catalog-functions.mjs', { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const source = new TextDecoder('utf-8', { fatal: true }).decode(await response.arrayBuffer()).replace(/^\uFEFF/, '');
          code.textContent = '';
          let target = null;
          for (const line of source.split(/\r?\n/)) {
            const row = document.createElement('span');
            row.className = 'source-line';
            row.textContent = line;
            const match = line.match(/^export (?:async )?function ([A-Za-z][A-Za-z0-9_]*)\(/);
            if (match && match[1] === requested) {
              row.classList.add('target');
              target = row;
            }
            code.append(row, '\n');
          }
          if (target) {
            title.textContent = `${requested} · 函数定义`;
            status.textContent = '已定位到所选函数';
            requestAnimationFrame(() => target.scrollIntoView({ block: 'center' }));
          } else {
            status.textContent = '完整函数模块';
          }
        } catch (error) {
          code.textContent = `函数源码加载失败：${error.message}。请从本地启动脚本访问页面，并确认 catalog-functions.mjs 文件完整。`;
          code.classList.add('source-error');
          status.textContent = '加载失败';
        }
      })();
    </script>
  </body>
</html>
